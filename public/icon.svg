<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Letter E Geometric Glyphs -->
  <!-- Left Spine -->
  <rect x="8.5" y="7.5" width="4.5" height="17" rx="1.5" fill="url(#letterGrad)"/>
  <!-- Top Bar -->
  <rect x="8.5" y="7.5" width="15" height="4.5" rx="1.5" fill="url(#letterGrad)"/>
  <!-- Middle Bar -->
  <rect x="8.5" y="13.75" width="12" height="4.5" rx="1.5" fill="url(#letterGrad)"/>
  <!-- Bottom Bar -->
  <rect x="8.5" y="20" width="15" height="4.5" rx="1.5" fill="url(#letterGrad)"/>
</svg>
